[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "pyte_rs"
version = "0.1.0"
description = "Rust kernels for pyte's per-cell loops, patched in by install()"
requires-python = ">=3.14"
license = "LGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["pyte"]

[tool.maturin]
python-source = "python"
module-name = "pyte_rs._native"
features = ["pyo3/extension-module"]

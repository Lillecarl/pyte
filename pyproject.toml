[build-system]
requires = ["flit_core"]
build-backend = "flit_core.buildapi"

[tool.flit.sdist]
include = ["docs/*.rst", "docs/*.py", "examples/", "tests/", "AUTHORS*", "CHANGES*", "LICENSE*"]
exclude = ["**/__pycache__/", "**/.*/", "*.lock"]

[tool.mypy]
show_error_codes = true
strict = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[dependency-groups]
dev = [
    "pytest",
    "pyperf==1.7.1",
    "mypy==1.14.1",
]

[project]
name = "pyte"
dynamic = ["version"]
description = "Simple VTXXX-compatible terminal emulator."
readme = "README.rst"
license = "LGPL-3.0-only"
requires-python = ">=3.14"
authors = [
    { name = "Sergei Lebedev", email = "superbobry@gmail.com" },
]
keywords = [
    "terminal emulator",
    "vt102",
    "vte",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3.14",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]
dependencies = [
    "wcwidth",
]

[project.optional-dependencies]
# What a check installs, beside what pyte itself needs. hypothesis
# generates the sequences that `test_row_versions.py` puts through a
# screen: a recording holds what one program happened to write, and the
# paths that move whole ranges of rows are the ones a recording is least
# likely to reach.
#
# `[dependency-groups] dev` above is upstream's list and says nearly the
# same thing. It is not this: a group is for a person with `uv`, and an
# extra is what an installer resolves. `nix/checks.nix` reads this one.
# Lillecarl/pymux#319.
test = [
    "pytest",
    "hypothesis",
]

[project.urls]
Homepage = "https://github.com/selectel/pyte"

[tool.ruff]
# Mirror of the `ruff.toml` beside the umbrella: the build sandbox
# sees only this tree, so discovery from a file under it must end
# here. Keep the two in step; the why lives up there.
#
# The floor is 3.14, like the umbrella's.
target-version = "py314"
# Pinned: a ruff upgrade must never silently reflow the tree.
line-length = 120

[tool.ruff.lint]
# Mirror of the umbrella `ruff.toml`, rule for rule: the build
# sandbox sees only this tree, so discovery from a file under it
# must end here. Change the rules in both places. Every rule here
# autofixes cleanly through the editor pipeline, and the gate below
# holds what the pipeline leaves behind.
#
# UP037 unquotes an annotation once the future import makes it lazy.
# I001 sorts the imports the pipeline already organizes. UP006,
# UP007 and UP045 spell the modern syntax the floor already runs.
# UP009, UP015, UP024 and UP033 are four trivial modernizations.
# F401 drops the imports nothing reads. RUF100 drops the `noqa`
# comments nothing needs. RUF023 sorts the slots. PIE790, PIE800
# and PIE808 drop three kinds of dead weight.
#
# Strings: `%` stays where it is. New code prefers f-strings, and a
# `%` a touch already rewrites may ride along, but there is no bulk
# migration: UP031 has no autofix, and its thousand sites are a
# manual, trap-laden rewrite (a tuple on the right of `%` formats
# its elements, an f-string its repr). UP031 and UP032 stay off for
# the same reason.
#
# FA100 is absent: on this floor it fires only where a rewrite needs
# the import, and its fix is unsafe, so the editor never applies it.
# The presence of the import is held per package by its own gate.
# TC001-TC003 are deferred: should a runtime reader ever need a
# name, that name keeps a runtime import through the
# `runtime-evaluated-*` exemptions, per symbol.
#
# UP035 moves the typing names to `collections.abc`.
# RUF022 sorts `__all__`.
# RET501, RET502, RET505 and RET506 flatten what follows return
# and raise: no `else` after either, and no bare `return None`.
# PT006 names parametrize cases with tuples, not strings.
select = [
    "B035",
    "F401",
    "FURB116",
    "FURB122",
    "FURB129",
    "FURB132",
    "FURB136",

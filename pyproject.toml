[build-system]
requires = ["flit_core"]
build-backend = "flit_core.buildapi"

[tool.flit.sdist]
include = ["docs/*.rst", "docs/*.py", "examples/", "tests/", "AUTHORS*", "CHANGES*", "LICENSE*"]
exclude = ["**/__pycache__/", "**/.*/", "*.lock"]

[tool.mypy]
show_error_codes = true
strict = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[dependency-groups]
dev = [
    "pytest",
    "pyperf==1.7.1",
    "mypy==1.14.1",
]

[project]
name = "pyte"
dynamic = ["version"]
description = "Simple VTXXX-compatible terminal emulator."
readme = "README.rst"
license = "LGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Sergei Lebedev", email = "superbobry@gmail.com" },
]
keywords = [
    "terminal emulator",
    "vt102",
    "vte",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]
dependencies = [
    "wcwidth",
]

[project.optional-dependencies]
# What a check installs, beside what pyte itself needs. hypothesis
# generates the sequences that `test_row_versions.py` puts through a
# screen: a recording holds what one program happened to write, and the
# paths that move whole ranges of rows are the ones a recording is least
# likely to reach.
#
# `[dependency-groups] dev` above is upstream's list and says nearly the
# same thing. It is not this: a group is for a person with `uv`, and an
# extra is what an installer resolves. `nix/checks.nix` reads this one.
# Lillecarl/pymux#319.
test = [
    "pytest",
    "hypothesis",
]

[project.urls]
Homepage = "https://github.com/selectel/pyte"
